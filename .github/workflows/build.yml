name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    strategy:
      matrix:
        language: [en, zh-CN]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build
        shell: pwsh
        run: .\scripts\build.ps1 -Language '${{ matrix.language }}'
      - name: UI and language regression
        shell: pwsh
        run: .\scripts\test.ps1 -ApplicationDirectory '.\artifacts\app-${{ matrix.language }}'
